services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sparkai-backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - CHECKPOINT_DB=/app/data/checkpoints.sqlite
    volumes:
      - ./backend/rag/dbchroma:/app/backend/rag/dbchroma
      - ./data:/app/data
    networks:
      - sparkai-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: sparkai-frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000
      - API_USERNAME=${API_USERNAME}
      - API_PASSWORD=${API_PASSWORD}
    depends_on:
      - backend
    networks:
      - sparkai-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  sparkai-network:
    driver: bridge
